services:
  # ---------------------------------------------------------
  # Service 1: The Judge (Ethereum Blockchain)
  # ---------------------------------------------------------

  # ---------------------------------------------------------
  # Service 2: IPFS (Decentralized Storage)
  # ---------------------------------------------------------
  ipfs:
    container_name: thesis-ipfs
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    environment:
      - IPFS_PROFILE=server

  # ---------------------------------------------------------
  # Service 3: NODE A - The Issuer (Government/Authority)
  # ---------------------------------------------------------
  issuer-acapy:
    container_name: thesis-issuer-agent
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.12-1.2.0
    ports:
      - "8020:8000" # ADMIN PORT (Mapped to 8020)
      - "8021:8001" # HTTP PORT  (Mapped to 8021)
    environment:
      - ACAPY_GENESIS_URL=http://test.bcovrin.vonx.io/genesis
      - ACAPY_WALLET_SEED=<ACApy wallet seed> # 32 chars
      
      # NOTE: You will need to put your first Ngrok URL here
      - ACAPY_ENDPOINT=<ngrok URL here>
      
      - ACAPY_LABEL=Government_Issuer
      - ACAPY_INBOUND_TRANSPORT=[["http", "0.0.0.0", "8001"]]
      - ACAPY_OUTBOUND_TRANSPORT=["http"]
      - ACAPY_ADMIN=["0.0.0.0", "8000"]
      - ACAPY_ADMIN_INSECURE_MODE=true
      
      - ACAPY_WALLET_TYPE=askar
      - ACAPY_WALLET_NAME=issuer_wallet
      - ACAPY_WALLET_KEY=issuer_secret_key
      - ACAPY_AUTO_PROVISION=true
      
      - ACAPY_AUTO_ACCEPT_INVITES=true
      - ACAPY_AUTO_ACCEPT_REQUESTS=true
      - ACAPY_AUTO_VERIFY_PRESENTATION=true
      - ACAPY_LOG_LEVEL=info
      - ACAPY_PRESERVE_EXCHANGE_RECORDS=true
    command: start

  # ---------------------------------------------------------
  # Service 4: NODE B - The Verifier (DeFi Platform)
  # ---------------------------------------------------------
  verifier-acapy:
    container_name: thesis-verifier-agent
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.12-1.2.0
    ports:
      - "8030:8000" # ADMIN PORT (Mapped to 8030)
      - "8031:8001" # HTTP PORT  (Mapped to 8031)
    environment:
      - ACAPY_GENESIS_URL=http://test.bcovrin.vonx.io/genesis
      - ACAPY_WALLET_SEED=<ACApy wallet seed> # 32 chars
      
      # NOTE: You will need to put your second Ngrok URL here
      - ACAPY_ENDPOINT=<another tunnel / ngrok url>
      
      - ACAPY_LABEL=DeFi_Platform
      - ACAPY_INBOUND_TRANSPORT=[["http", "0.0.0.0", "8001"]]
      - ACAPY_OUTBOUND_TRANSPORT=["http"]
      - ACAPY_ADMIN=["0.0.0.0", "8000"]
      - ACAPY_ADMIN_INSECURE_MODE=true
      
      - ACAPY_WALLET_TYPE=askar
      - ACAPY_WALLET_NAME=verifier_wallet
      - ACAPY_WALLET_KEY=verifier_secret_key
      - ACAPY_AUTO_PROVISION=true
      
      - ACAPY_AUTO_ACCEPT_INVITES=true
      - ACAPY_AUTO_ACCEPT_REQUESTS=true
      - ACAPY_AUTO_VERIFY_PRESENTATION=true
      - ACAPY_LOG_LEVEL=info
      - ACAPY_PRESERVE_EXCHANGE_RECORDS=true
    command: start
